# SPDX-License-Identifier: GPL-3.0-only WITH GPL-3.0-linking-exception
# Builds the SMK-37 Elite firmware on GitHub, so no toolchain is needed locally.
# JieLi's installer is downloaded, checked against a pinned SHA-256 and
# unpacked with innoextract; it is never executed.
name: Build Elite firmware

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  TOOLCHAIN_URL: https://jl-update.oss-cn-shenzhen.aliyuncs.com/2.5.3.exe
  TOOLCHAIN_SHA256: 399bd518a28e47a7a0394506cebd5bf658748a58cd6b7c02512e24b4b88c5a5e

jobs:
  elite:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/smk37-toolchain/2.5.3.exe
          key: jieli-${{ env.TOOLCHAIN_SHA256 }}
      - name: Fetch, verify and unpack the JieLi 2.5.3 toolchain
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP 'smk37-toolchain'
          $exe = Join-Path $cache '2.5.3.exe'
          if (!(Test-Path $exe)) {
            New-Item -ItemType Directory -Force $cache | Out-Null
            Invoke-WebRequest $env:TOOLCHAIN_URL -OutFile $exe
          }
          if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:TOOLCHAIN_SHA256) { throw 'The toolchain installer is not the expected file.' }
          choco install innoextract --no-progress -y
          innoextract -s -d (Join-Path $cache 'unpacked') $exe
      - name: Build the Elite firmware
        shell: powershell
        run: ./sdk/Build.ps1 -Model elite -FirmwareOnly -Toolchain (Join-Path $env:RUNNER_TEMP 'smk37-toolchain/unpacked/C$/JL/pi32')
      # Artifacts are not always reachable: print size, heap and the largest
      # contributors into the log. The packager limit is 453,921 app bytes.
      - name: Report image size, heap and largest symbols
        if: always()
        shell: pwsh
        run: |
          $build = 'build/elite'
          foreach ($name in 'firmware-report.json','build-identity.json','package-report.json') {
            $path = Join-Path $build $name
            if (Test-Path $path) { Write-Host "== $name"; Get-Content $path | ForEach-Object { Write-Host $_ } }
          }
          $nm = Join-Path $env:RUNNER_TEMP 'smk37-toolchain/unpacked/C$/JL/pi32/bin/llvm-nm.exe'
          $elf = Join-Path $build 'sdk.elf'
          if ((Test-Path $elf) -and (Test-Path $nm)) {
            Write-Host '== 40 largest symbols (address size type name, decimal)'
            & $nm --print-size --size-sort --radix=d $elf | Select-Object -Last 40 | ForEach-Object { Write-Host $_ }
            Write-Host '== SeqAdv symbols'
            & $nm --print-size --radix=d $elf | Where-Object { $_ -match 'seqadv|seq_|m0_|sq_' } | ForEach-Object { Write-Host $_ }
          }
          $map = Join-Path $build 'sdk.map'
          if (Test-Path $map) {
            $lines = [IO.File]::ReadAllLines($map)
            Write-Host "== sdk.map: $($lines.Count) lines; first 25"
            $lines | Select-Object -First 25 | ForEach-Object { Write-Host $_ }
            # Sum input-section sizes per input file (GNU ld or lld map layout).
            $sizes = @{}
            $pending = $null
            foreach ($line in $lines) {
              if ($line -match '^\s*\.(text|data|rodata|ram0_data|cache_ram_data|bss)[\w.$]*\s*$') { $pending = $Matches[1]; continue }
              if ($line -match '^\s*(\.(text|data|rodata|ram0_data|cache_ram_data|bss)[\w.$]*)?\s+0x([0-9a-fA-F]+)\s+0x([0-9a-fA-F]+)\s+(\S+\.(o|obj|a\([^)]*\)))\s*$') {
                $kind = if ($Matches[2]) { $Matches[2] } else { $pending }
                $pending = $null
                if (!$kind) { continue }
                $key = "$kind $($Matches[5])"
                $sizes[$key] = [long]$sizes[$key] + [Convert]::ToInt64($Matches[4],16)
              } else { $pending = $null }
            }
            Write-Host '== 30 largest input files by section (bytes section file)'
            $sizes.GetEnumerator() | Sort-Object Value -Descending | Select-Object -First 30 | ForEach-Object { Write-Host ("{0,8} {1}" -f $_.Value, $_.Key) }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: smk37-elite-firmware
          path: |
            build/elite/generated/
            build/elite/*.json
            build/elite/sdk.map

  simulator:
    name: Browser simulator
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: build/tools
          key: wasi-sdk-27-windows
      - name: Build the browser preview (downloads and verifies WASI SDK 27 on first use)
        shell: powershell
        run: ./tools/Build-Web.ps1 -LocalPreview
      - uses: actions/upload-artifact@v4
        with:
          name: smk37-simulator
          path: build/preview/

  installer:
    name: Elite installer page
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/smk37-toolchain/2.5.3.exe
          key: jieli-${{ env.TOOLCHAIN_SHA256 }}
      - uses: actions/cache@v4
        with:
          path: build/tools
          key: wasi-sdk-27-windows
      - name: Fetch, verify and unpack the JieLi 2.5.3 toolchain
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP 'smk37-toolchain'
          $exe = Join-Path $cache '2.5.3.exe'
          if (!(Test-Path $exe)) {
            New-Item -ItemType Directory -Force $cache | Out-Null
            Invoke-WebRequest $env:TOOLCHAIN_URL -OutFile $exe
          }
          if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:TOOLCHAIN_SHA256) { throw 'The toolchain installer is not the expected file.' }
          choco install innoextract --no-progress -y
          innoextract -s -d (Join-Path $cache 'unpacked') $exe
      - name: Build the offline workbench with this firmware embedded
        shell: powershell
        env:
          FM1_SOURCE_URL: https://github.com/${{ github.repository }}/archive/${{ github.sha }}.zip
        run: ./sdk/Build.ps1 -Model elite -Package -Toolchain (Join-Path $env:RUNNER_TEMP 'smk37-toolchain/unpacked/C$/JL/pi32')
      - uses: actions/upload-artifact@v4
        with:
          name: smk37-elite-installer
          path: build/official-web/elite/
